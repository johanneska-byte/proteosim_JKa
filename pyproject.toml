[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "proteosim_JKa"
version = "0.1.0"
description = "This project simulates a simplified bottom-up proteomics workflow. It covers several key steps commonly used in protein analysis"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Johannes Karlein" }]
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pytest",
    "pandas",
    "mathplotlib",
    "pyteomics" # Add all required dependencies
]

[tool.setuptools.packages.find]
include = ["proteosim_JKa*"]
